# Streamlit secrets for the Theorem Codex dashboard.
#
# Copy this file to .streamlit/secrets.toml and fill in real values.
# NEVER commit the real secrets.toml (it is gitignored and dockerignored).

# --- Option A: OIDC single sign-on (Google shown; any OIDC provider works) ---
# Requires Authlib (already in requirements.txt). When [auth] is configured,
# the app uses st.login() and ignores the shared password below.
#
# Google setup: https://console.cloud.google.com/apis/credentials
#   Create an OAuth 2.0 Client ID (web application) and add
#   <your-app-origin>/oauth2callback as an authorized redirect URI.
# Generate cookie_secret with:
#   python -c "import secrets; print(secrets.token_hex(32))"

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "replace-with-a-long-random-string"
client_id = "xxxxxxxx.apps.googleusercontent.com"
client_secret = "replace-me"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Restrict sign-in to specific accounts (comma-separated string or TOML
# array). Strongly recommended with public providers like Google, where
# otherwise ANY account can sign in. Can also be set via the
# THESIUS_ALLOWED_EMAILS environment variable.
thesius_allowed_emails = ["you@example.com"]

# --- Option B: shared password (used only when [auth] is absent) ---
# Equivalent to setting the THESIUS_PASSWORD environment variable.
# thesius_password = "change-me"
