[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-research-workbench"
version = "0.1.0"
description = "Configurable proof-search automation workbench for mathematical research"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
