[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-frontier-templates"
version = "0.1.0"
description = "LangChain prompt templates for mathematical frontier proof search"
requires-python = ">=3.10"
dependencies = [
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
math_frontier_templates = []
