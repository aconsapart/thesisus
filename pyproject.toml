[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesius"
version = "0.3.0"
description = "Local-first theorem codex with Python CLI/TUI, Datasette, Streamlit, and research-agent components."
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pandas>=2.0",
  "plotly>=5.0",
  "streamlit>=1.30",
  "datasette>=0.64",
]

[project.optional-dependencies]
agents = [
  "langgraph",
  "langchain",
  "langchain-openai",
  "pydantic",
  "sympy",
  "requests",
]
test = [
  "pytest>=8.0",
]
paper = [
  "anthropic>=0.40",
  "pypdf",
  "pymupdf",
  "pymupdf4llm",
  "requests",
]
paper-aider = [
  "aider-chat",
]

[project.scripts]
thesius = "thesius.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thesius = ["paper/latex/*", "paper/fewshot_examples/*"]
